[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kerui-recruit"
version = "0.1.0"
description = "Local-first recruitment talent database and matching desktop backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
  "sqlalchemy>=2.0.43,<3",
  "uuid6>=2025.0.1,<2027",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kerui_recruit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
